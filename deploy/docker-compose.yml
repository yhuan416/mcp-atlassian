services:
  jira-mcp:
    image: mcp-atlassian-jiral:0.24.7-jiral.1
    container_name: jira-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      # HTTP 传输默认拒绝无凭据请求（401），单租户网关必须显式允许回落到 .env 里的全局凭据
      - ALLOW_GLOBAL_CRED_FALLBACK=true
      # 限制客户端可指定 Jira 域的 SSRF 面
      - MCP_ALLOWED_URL_DOMAINS=jira.fujikam.com
      # 附件落盘根目录（jira_download_attachments_to_disk 的默认父目录）
      - MCP_ATLASSIAN_FILES_DIR=/data
      - TOOLSETS=all
    command:
      - "--transport=streamable-http"
      - "--host=0.0.0.0"
      - "--port=8787"
      - "--path=/mcp"
      - "--stateless"
    ports:
      - "8789:8787"
    volumes:
      - ./data:/data
    healthcheck:
      # alpine 镜像没有 curl，用 python 探端口
      test:
        - "CMD-SHELL"
        - "python -c \"import socket;s=socket.socket();s.settimeout(2);exit(s.connect_ex(('127.0.0.1',8787)))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 附件分发：其它机器用 X-Files-Token 头直接取 /data 下的文件
  jira-files:
    image: nginx:alpine
    container_name: jira-files
    restart: unless-stopped
    environment:
      - FILES_TOKEN=${FILES_TOKEN}
    volumes:
      - ./data:/data:ro
      - ./nginx-files.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8790:8790"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8790/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3